<body>
<script>
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (!a) return;
  var m = (e.message || 'erreur') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ')';
  a.innerHTML = '<div style="padding:24px;font-family:sans-serif"><b>Un problème est survenu</b><p style="color:#c0392b;word-break:break-word">' + m.replace(/</g, '&lt;') + '</p><p>Envoyez-moi une capture de cet écran.</p></div>';
}, true);
</script>
<div id="app" aria-live="polite"><p style="padding:40px 20px;font-family:sans-serif;color:#6b7388">Chargement…</p></div>
